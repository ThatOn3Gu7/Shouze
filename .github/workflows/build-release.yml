name: Build & Release

# Runs when you push a version tag like v1.3.0. The tag IS the release
# version — bump versionName in app/build.gradle.kts yourself before tagging.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # If this step fails (compose/kotlin/build error), the job stops here
      # and NO release is created for this tag.
      - name: Build (compile + assemble)
        id: build
        env:
          STORE_PWD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > keystore.jks
            ./gradlew assembleRelease assembleDebug \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore.jks" \
              -Pandroid.injected.signing.store.password="$STORE_PWD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PWD"
            rm -f keystore.jks
          else
            ./gradlew assembleRelease assembleDebug
          fi

      - name: Stage APKs with descriptive names
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$VERSION" ]; then VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//'); fi
          mkdir -p apks
          cp app/build/outputs/apk/release/*.apk "apks/Shouze-release-$VERSION.apk"
          cp app/build/outputs/apk/debug/*.apk "apks/Shouze-debug-$VERSION.apk"

      - name: Generate release notes
        id: notes
        run: |
          PREV=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV" ]; then RANGE=""; else RANGE="$PREV..HEAD"; fi
          python3 .github/scripts/gen_release_notes.py "$RANGE" > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shouze ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            apks/*.apk
          draft: false
          prerelease: false
