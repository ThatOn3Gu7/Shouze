# Locale & encoding for the Gradle daemon (avoids garbled output)
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2

# Kotlin
kotlin.code.style=official

# JVM / Gradle — kept small for low-RAM devices
org.gradle.jvmargs=-Xmx1024m -Xms256m -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false