# Template Gradle build properties.
#
# gradle.properties itself is machine-local and gitignored (it is also the
# right home for personal settings such as ANILIST_CLIENT_ID). Builds with no
# global Gradle config — e.g. CI, or a fresh desktop clone — start from here:
#
#     cp gradle.properties.example gradle.properties
#
# If you already configure Gradle globally (~/.gradle/gradle.properties),
# you don't need a project copy at all; global settings win over project ones.

# Heap sized for on-device (Termux) builds. Desktops/CI override it larger
# (the CI workflow appends its own org.gradle.jvmargs after copying this file).
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1024m -Xms256m -XX\:+UseParallelGC -Dfile.encoding\=UTF-8 -Dsun.jnu.encoding\=UTF-8 -Duser.language\=en -Duser.country\=US

# ---------------------------------------------------------------------------
# AniList integration (see docs/ANILIST_SETUP.md)
# Create an application at https://anilist.co/settings/developer with the
# redirect URL `shouze://anilist-auth`, then paste its client id below.
# The client id is public (implicit grant); the client secret must NOT be added.
# Default builds already bake in the maintainer's id — set yours only to override.
# ---------------------------------------------------------------------------
# ANILIST_CLIENT_ID=12345
